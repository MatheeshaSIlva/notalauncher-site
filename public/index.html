<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not a Launcher</title>
<meta name="description" content="A canvas your phone runs. In development.">
<meta property="og:title" content="Not a Launcher">
<meta property="og:description" content="A canvas your phone runs. In development.">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Plex';src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Plex';src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Mono';src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Mono';src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
:root{--bg:#0A0A0A;--line:#2A2A2A;--ink:#F2F2F2;--mute:#8A8A8A;--dim:#3A3A3A;--sig:#D9865F}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:'Plex',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
header,footer{padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-family:'Mono';font-size:12px;color:var(--mute)}
header{border-bottom:1px solid var(--line)}
footer{border-top:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;font-size:17px;font-weight:500;letter-spacing:-0.01em}
.mark{width:26px;height:26px;flex:none;display:block}
.tag b{color:var(--sig);font-weight:400}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;gap:36px}
.stage{position:relative;width:min(100%,520px);aspect-ratio:2/1}
#tess{position:absolute;left:50%;top:50%;width:min(46%,220px);transform:translate(-50%,-50%)}
pre{position:absolute;inset:0;margin:0;font-family:'Mono';font-size:clamp(9px,1.7vw,15px);line-height:1.5;letter-spacing:.5em;color:var(--dim);user-select:none;white-space:pre;display:flex;align-items:center;justify-content:center;text-align:center}
pre b{font-weight:400;color:var(--ink)}
pre i{font-style:normal;color:var(--sig)}
pre u{text-decoration:none;color:#6A6A6A}
h1{margin:0;font-size:clamp(26px,4.2vw,40px);font-weight:600;letter-spacing:-0.03em;text-align:center}
.sub{margin:0;font-family:'Mono';font-size:14px;color:var(--mute);text-align:center;min-height:1.4em}
.sub .c{display:inline-block;width:.5em;height:1em;background:var(--sig);vertical-align:-0.15em;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media (max-width:560px){header,footer{padding:16px 20px}.tag span{display:none}}
</style>
</head>
<body>
<header>
  <a class="brand" href="/" aria-label="Not a Launcher">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><g transform="translate(-4 -4) scale(1.125)"><path d="M19 18h5a3 3 0 0 1 3 3v8l-1.6 9.2a1.7 1.7 0 0 1-1.7 1.8h-4.4a1.7 1.7 0 0 1-1.7-1.8L16 29v-8a3 3 0 0 1 3-3z" fill="#F2F2F2"/><path d="M19 18h5a3 3 0 0 1 3 3v8l-1.6 9.2a1.7 1.7 0 0 1-1.7 1.8h-4.4a1.7 1.7 0 0 1-1.7-1.8L16 29v-8a3 3 0 0 1 3-3z" fill="#F2F2F2" transform="translate(21 0)"/></g></svg>
    <span><em style="font-style:normal;color:#D9865F">"</em>Not a Launcher<em style="font-style:normal;color:#D9865F">"</em></span>
  </a>
  <div class="tag"><span>android · shizuku · no root · </span><b>in development</b></div>
</header>

<main>
  <div class="stage">
    <pre id="field" aria-hidden="true"></pre>
    <svg id="tess" viewBox="0 0 64 64" aria-hidden="true"><g id="eyes"><path id="e1" fill="#F2F2F2"/><path id="e2" fill="#F2F2F2"/></g><rect id="bar" x="16" y="47" width="32" height="3" rx="1.5" fill="#2A2A2A"/><rect id="barf" x="16" y="47" width="0" height="3" rx="1.5" fill="#D9865F"/></svg>
  </div>
  <h1>A canvas your phone runs.</h1>
  <p class="sub"><span id="st">building</span><span class="c" aria-hidden="true"></span></p>
</main>

<footer>
  <span>© 2026 Not a Launcher</span>
  <span>not yet released</span>
</footer>

<script>
(function(){
  var field=document.getElementById('field'),st=document.getElementById('st');
  var e1=document.getElementById('e1'),e2=document.getElementById('e2'),eyes=document.getElementById('eyes'),barf=document.getElementById('barf');
  var OPEN='M19 18h5a3 3 0 0 1 3 3v8l-1.6 9.2a1.7 1.7 0 0 1-1.7 1.8h-4.4a1.7 1.7 0 0 1-1.7-1.8L16 29v-8a3 3 0 0 1 3-3z';
  var SHUT='M18 27h7a2 2 0 0 1 0 4h-7a2 2 0 0 1 0-4z';
  var HAPPY='M16 38c0-10 3-16 5.5-16S27 28 27 38z';
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=30,H=11,t0=performance.now(),blinkAt=1.2,blink=-1,lookAt=0,dx=0,msgAt=0,mi=0,happyAt=-9;
  var msgs=['building','laying tiles','compiling layouts','checking contrast','polishing the glass'];
  function frame(now){
    var t=reduce?1:(now-t0)/1000;
    if(!reduce){
      if(t>blinkAt){blink=t;blinkAt=t+2+Math.random()*2.6;}
      if(t>lookAt){dx=[0,-3,3,0][Math.floor(Math.random()*4)];lookAt=t+1.5+Math.random()*4;}
      if(t>msgAt){mi++;st.textContent=msgs[mi%msgs.length];msgAt=t+3.2;if(mi%msgs.length===0)happyAt=t;}
    }
    var happy=t-happyAt<1.1, shut=blink>=0&&t-blink<0.11;
    var d=happy?HAPPY:(shut?SHUT:OPEN);
    e1.setAttribute('d',d);e2.setAttribute('d',d);e2.setAttribute('transform','translate(21 0)');
    eyes.setAttribute('transform','translate('+(happy?0:dx)+' 0)');
    barf.setAttribute('width',String(32*((t*0.11+mi*0.37)%1)));
    var out='';
    for(var y=0;y<H;y++){var row='';for(var x=0;x<W;x++){var r=Math.sin(x*0.5+y*0.8-t*1.2);var cx=Math.abs(x-(W-1)/2),cy=Math.abs(y-(H-1)/2);var hole=cx<4.5&&cy<2.6;row+=hole?' ':(r>0.55?'•':'·');}out+=row+'\n';}
    field.textContent=out;
    if(!reduce)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

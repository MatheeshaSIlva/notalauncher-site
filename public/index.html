<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not a Launcher</title>
<meta name="description" content="A canvas your phone runs. In development.">
<meta property="og:title" content="Not a Launcher">
<meta property="og:description" content="A canvas your phone runs. In development.">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Plex';src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Plex';src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Mono';src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Mono';src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
:root{--bg:#0A0A0A;--line:#2A2A2A;--ink:#F2F2F2;--mute:#8A8A8A;--dim:#3A3A3A;--sig:#D9865F}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:'Plex',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
header,footer{padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-family:'Mono';font-size:12px;color:var(--mute)}
header{border-bottom:1px solid var(--line)}
footer{border-top:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;font-size:17px;font-weight:500;letter-spacing:-0.01em}
.mark{position:relative;width:26px;height:26px;flex:none}
.mark i{position:absolute;width:11px;height:11px;border-radius:2px;display:block}
.tag b{color:var(--sig);font-weight:400}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;gap:36px}
.stage{position:relative;width:min(100%,620px);aspect-ratio:56/26}
pre{position:absolute;inset:0;margin:0;font-family:'Mono';font-size:clamp(8px,1.5vw,14px);line-height:1.22;letter-spacing:.06em;color:var(--dim);user-select:none;white-space:pre;display:flex;align-items:center;justify-content:center}
pre b{font-weight:400;color:var(--ink)}
pre i{font-style:normal;color:var(--sig)}
pre u{text-decoration:none;color:#6A6A6A}
h1{margin:0;font-size:clamp(26px,4.2vw,40px);font-weight:600;letter-spacing:-0.03em;text-align:center}
.sub{margin:0;font-family:'Mono';font-size:14px;color:var(--mute);text-align:center;min-height:1.4em}
.sub .c{display:inline-block;width:.5em;height:1em;background:var(--sig);vertical-align:-0.15em;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media (max-width:560px){header,footer{padding:16px 20px}.tag span{display:none}}
</style>
</head>
<body>
<header>
  <a class="brand" href="/" aria-label="Not a Launcher">
    <span class="mark" aria-hidden="true"><i style="left:0;top:0;background:#D9865F"></i><i style="left:14px;top:3px;background:#2A2A2A"></i><i style="left:3px;top:14px;background:#2A2A2A"></i><i style="left:15px;top:15px;background:#F2F2F2"></i></span>
    <span>Not a Launcher</span>
  </a>
  <div class="tag"><span>android · shizuku · no root · </span><b>in development</b></div>
</header>

<main>
  <div class="stage"><pre aria-hidden="true"><span id="a"></span></pre></div>
  <h1>A canvas your phone runs.</h1>
  <p class="sub"><span id="st">building</span><span class="c" aria-hidden="true"></span></p>
</main>

<footer>
  <span>© 2026 Not a Launcher</span>
  <span>not yet released</span>
</footer>

<script>
(function(){
  var el=document.getElementById('a'),st=document.getElementById('st');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=56,H=22,TW=11,TH=5;
  // Tess: the four tiles of the mark. [col,row,kind]  s=terracotta g=grey w=white(face)
  var TILES=[[0,0,'s'],[12,1,'g'],[1,7,'g'],[13,8,'w']];
  var OX=Math.floor((W-24)/2),OY=Math.floor((H-14)/2);
  var t0=performance.now(),blinkNext=1.8,blinkT=-1,lookT=0,look=0,hopT=-9,msgT=0,mi=0;
  var msgs=['building','laying tiles','compiling layouts','checking contrast','polishing the glass','building'];
  function frame(now){
    var t=reduce?1.0:(now-t0)/1000;
    if(!reduce){
      if(t>blinkNext){blinkT=t;blinkNext=t+2+Math.random()*2.5;}
      if(t>lookT){look=[0,-1,1,0][Math.floor(Math.random()*4)];lookT=t+1.5+Math.random()*4;}
      if(t-hopT>7+Math.random()*3)hopT=t;
      if(t>msgT){st.textContent=msgs[mi%msgs.length];mi++;msgT=t+2.8;}
    }
    var blink=blinkT>=0&&t-blinkT<0.14;
    var hop=Math.max(0,Math.sin(Math.min(1,(t-hopT)/0.5)*Math.PI));
    var g=[],c=[];
    for(var y=0;y<H;y++){g.push(new Array(W).fill(' '));c.push(new Array(W).fill(''));}
    // background: grout grid with a slow ripple
    for(var y=0;y<H;y++)for(var x=0;x<W;x++){
      var r=Math.sin(x*0.28+y*0.5-t*1.3);
      if(x%8===0&&y%4===0){g[y][x]='+';c[y][x]='u';}
      else if(x%8===0){g[y][x]=r>0.3?'|':' ';}
      else if(y%4===0){g[y][x]=r>0.3?'-':' ';}
      else if(r>0.96){g[y][x]='·';}
    }
    function put(x,y,ch,k){if(x>=0&&x<W&&y>=0&&y<H){g[y][x]=ch;c[y][x]=k;}}
    for(var k=0;k<4;k++){
      var kind=TILES[k][2],lift=Math.round(hop*(2.2-k*0.4))+Math.round(Math.sin(t*1.5+k*1.3)*0.6);
      var x0=OX+TILES[k][0],y0=OY+TILES[k][1]-lift,col=kind==='s'?'i':(kind==='w'?'b':'u');
      for(var yy=0;yy<TH;yy++)for(var xx=0;xx<TW;xx++){
        var ch;
        if(yy===0)ch=xx===0?'┌':(xx===TW-1?'┐':'─');
        else if(yy===TH-1)ch=xx===0?'└':(xx===TW-1?'┘':'─');
        else if(xx===0||xx===TW-1)ch='│';
        else ch=kind==='w'?' ':(kind==='s'?'▒':'░');
        put(x0+xx,y0+yy,ch,col);
      }
      if(kind==='w'){
        var e1=x0+3+look,e2=x0+7+look,ey=y0+1+(hop>0.5?0:1);
        put(e1,ey,blink?'─':'●','i');put(e2,ey,blink?'─':'●','i');
        var my=y0+3;
        if(hop>0.5){put(x0+5,my,'o','i');}
        else{put(x0+4,my,'╰','i');put(x0+5,my,'─','i');put(x0+6,my,'╯','i');}
      }
    }
    // shadow
    var sy=OY+14;for(var x=OX+3;x<OX+22;x++)put(x,sy,hop>0.2?'·':'▔','u');
    var out='',cur='';
    for(var y=0;y<H;y++){for(var x=0;x<W;x++){var k=c[y][x];if(k!==cur){if(cur)out+='</'+cur+'>';if(k)out+='<'+k+'>';cur=k;}out+=g[y][x];}if(cur){out+='</'+cur+'>';cur='';}out+='\n';}
    el.innerHTML=out;
    if(!reduce)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
